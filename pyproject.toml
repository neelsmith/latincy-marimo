[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latincy-marimo"
version = "1.0.0"
description = "Marimo notebooks illustrating token and lexeme analysis with latincy text model."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Neel Smith", email = "dnsmith.neel@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "marimo>=0.20.4",
    "spacy>=3.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]


