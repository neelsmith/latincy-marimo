[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latincy-marimo"
version = "1.0.0"
description = "Marimo notebooks illustrating token and lexeme analysis with latincy text model."
readme = "README.md"
requires-python = ">=3.10, <3.14"
authors = [{ name = "Neel Smith", email = "dnsmith.neel@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "marimo>=0.20.4",
    "spacy>=3.7",
    "la_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/la_core_web_sm-3.7.0/la_core_web_sm-3.7.0-py3-none-any.whl ; python_version < '3.13'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]


